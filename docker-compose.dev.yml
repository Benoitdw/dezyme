services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    security_opt:
      - label:disable
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    user: "${UID}:${GID}"
    security_opt:
      - label:disable
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/config.toml:/app/config.toml:ro
      - ./backend/.env:/app/.env:ro
      - ./backend/data:/app/data
      - ./data:/data
    env_file:
      - ./backend/.env
    depends_on:
      - popmusic

  # Same image as in production, without the GPU reservation: PoPMuSiC runs
  # on the CPU here (slower, same results).
  popmusic:
    build:
      context: ./dockerfiles
      dockerfile: popmusic.Dockerfile
      additional_contexts:
        app: ./softwares/popmusic
        wrapper: ./wrapper
      args:
        UID: "${UID}"
        GID: "${GID}"
    user: "${UID}:${GID}"
    security_opt:
      - label:disable
    volumes:
      - ./data:/data
      - ./models/popmusic:/models
