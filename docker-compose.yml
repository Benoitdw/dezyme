services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/config.toml:/app/config.toml:ro
      - ./backend/.env:/app/.env:ro
      - ./backend/data:/app/data
      - ./backend/local_task:/app/local_task
      - ~/.ssh:/run/ssh:ro
    env_file:
      - ./backend/.env
